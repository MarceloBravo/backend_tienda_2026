name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          TOKEN_SECRETS: ci-access-secret
          REFRESHTOKEN_SECRETS: ci-refresh-secret
          EXPIRES_TIME_TOKEN: 300s
          EXPIRES_TIME_REFRESHTOKEN: 1800s
          SALTROUND: '4'
